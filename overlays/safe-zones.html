<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <!-- OBS browser source: 1080 × 1920. Layout guide only — keep it hidden while live. -->
  <title>Safe Zones</title>
  <link rel="stylesheet" href="lib/overlay.css">
  <style>
    body { width: 1080px; height: 1920px; position: relative; }
    .z {
      position: absolute; display: flex; align-items: center; justify-content: center; text-align: center;
      background: repeating-linear-gradient(45deg, rgba(255, 59, 59, .28) 0 18px, rgba(255, 59, 59, .14) 18px 36px);
      border: 3px dashed rgba(255, 90, 90, .9);
      font-family: var(--brand-font-mono); font-weight: 700; font-size: 26px; color: #fff;
      text-shadow: 0 2px 6px #000;
    }
    .top { left: 0; right: 0; top: 0; height: 180px; }
    .right { right: 0; top: 820px; width: 150px; bottom: 620px; writing-mode: vertical-rl; }
    .bottom { left: 0; right: 0; bottom: 0; height: 620px; }
  </style>
</head>
<body>
  <div class="z top">TOP BAR · profile, viewers, close</div>
  <div class="z right">LIKE · GIFT · SHARE</div>
  <div class="z bottom">CHAT · GIFTS · COMMENT BOX<br>(fine for a face cam, not for text)</div>
</body>
</html>
