<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <!-- OBS browser source: 1080 × 1920 -->
  <title>Be Right Back</title>
  <link rel="stylesheet" href="lib/screen.css">
  <style>
    .dots span { display: inline-block; animation: pulse 1.4s infinite; }
    .dots span:nth-child(2) { animation-delay: .2s; }
    .dots span:nth-child(3) { animation-delay: .4s; }
  </style>
</head>
<body>
  <div class="frame"></div>
  <div class="safe">
    <img class="logo" src="../brand/logo.png" onerror="this.remove()" alt="">
    <div class="handle" id="handle"></div>
    <div class="display big">Be right<br>back<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
    <div class="rule"></div>
    <div class="sub" id="brb"></div>
    <div class="sub" id="song"></div>
  </div>

  <script src="config.js"></script>
  <script src="lib/obs-bus.js"></script>
  <script src="lib/overlay.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    StudioOverlay({
      render(s) {
        $('handle').textContent = s.handle || '';
        $('brb').textContent = s.brbText || '';
        $('song').innerHTML = s.song ? `Working on <b>${StudioOverlay.esc(s.song)}</b>` : '';
      },
    });
  </script>
</body>
</html>
