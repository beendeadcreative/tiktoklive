<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <!-- OBS browser source: 1000 × 220 -->
  <title>Session Card</title>
  <link rel="stylesheet" href="lib/overlay.css">
  <style>
    body { width: 1000px; height: 220px; padding: 6px; }
    .card { height: 100%; padding: 20px 28px; display: flex; flex-direction: column; justify-content: space-between; }

    .top { display: flex; align-items: center; gap: 16px; }
    .rec {
      display: none; align-items: center; gap: 10px;
      font-family: var(--brand-font-label); font-weight: 700; font-size: 22px;
      letter-spacing: 0.12em; color: var(--brand-rec);
    }
    .rec.on { display: flex; }
    .rec i { width: 16px; height: 16px; border-radius: 50%; background: var(--brand-rec); animation: pulse 1.4s infinite; }
    .stage { color: var(--brand-primary); }
    .timer { font-family: var(--brand-font-label); font-size: 28px; font-weight: 600; color: var(--brand-ink); font-variant-numeric: tabular-nums; }

    .middle { display: flex; align-items: baseline; gap: 18px; min-width: 0; }
    .song { font-size: 58px; line-height: 1.2; padding: 0 6px 4px 0; margin-bottom: -8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .version { flex: none; font-family: var(--brand-font-label); font-size: 22px; color: var(--brand-ink-dim); }
    .meta { margin-left: auto; flex: none; display: flex; gap: 8px; }
    .chip {
      font-family: var(--brand-font-label); font-size: 22px; font-weight: 600; letter-spacing: 0.04em;
      padding: 4px 12px; border-radius: 999px;
      background: var(--brand-tint); color: var(--brand-ink);
    }

    .sections { display: flex; gap: 8px; overflow: hidden; }
    .sec {
      flex: none; display: flex; align-items: center; gap: 8px;
      font-size: 21px; font-weight: 600; padding: 7px 16px; border-radius: 999px;
      color: var(--brand-ink-dim); border: 1px solid var(--brand-panel-border);
    }
    .sec.done { color: var(--brand-ink); background: var(--brand-tint); border-color: transparent; }
    .sec.done::before { content: '✓'; color: var(--brand-primary); font-weight: 800; }
    .sec.active { color: var(--brand-on-primary); background: var(--brand-primary); border-color: transparent; }
    .sec.active::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--brand-on-primary); animation: pulse 1.4s infinite; }
  </style>
</head>
<body>
  <div class="card fade hidden" id="card">
    <div class="top">
      <div class="rec" id="rec"><i></i>REC</div>
      <div class="eyebrow stage" id="stage"></div>
      <div class="meta" id="meta"></div>
      <div class="timer" id="timer"></div>
    </div>
    <div class="middle">
      <div class="display song" id="song"></div>
      <div class="version" id="version"></div>
    </div>
    <div class="sections" id="sections"></div>
  </div>

  <script src="config.js"></script>
  <script src="lib/obs-bus.js"></script>
  <script src="lib/overlay.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = StudioOverlay.esc;

    StudioOverlay({
      render(s) {
        $('card').classList.toggle('hidden', !s.song);
        $('rec').classList.toggle('on', !!s.rec);
        $('stage').textContent = s.stage || '';
        $('song').textContent = s.song || '';
        $('version').textContent = s.version || '';
        $('meta').innerHTML = [
          s.bpm && `${esc(s.bpm)} BPM`,
          s.key && esc(s.key),
          s.timeSig && esc(s.timeSig),
        ].filter(Boolean).map((t) => `<span class="chip">${t}</span>`).join('');
        $('sections').innerHTML = (s.sections || [])
          .map((sec) => `<span class="sec ${esc(sec.status)}">${esc(sec.label)}</span>`)
          .join('');
      },
      tick(s) {
        $('timer').textContent = s.sessionStart ? StudioOverlay.clock(Date.now() - s.sessionStart) : '';
      },
    });
  </script>
</body>
</html>
