<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <!-- OBS browser source: 1000 × 560. For the Playback / listening scene. -->
  <title>Now Playing</title>
  <link rel="stylesheet" href="lib/overlay.css">
  <style>
    body { width: 1000px; height: 560px; padding: 6px; }
    .card { height: 100%; padding: 40px 44px; display: flex; flex-direction: column; gap: 18px; justify-content: center; }
    .top { display: flex; align-items: center; gap: 16px; }
    .live { width: 18px; height: 18px; border-radius: 50%; background: var(--brand-tertiary); box-shadow: 0 0 0 0 var(--brand-tertiary); animation: ring 1.6s infinite; }
    @keyframes ring { to { box-shadow: 0 0 0 22px transparent; } }
    .song { font-size: 96px; }
    .version { font-family: var(--brand-font-label); font-size: 32px; color: var(--brand-tertiary); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
    .meta { font-family: var(--brand-font-label); font-size: 32px; color: var(--brand-ink-dim); letter-spacing: 0.04em; }
    .ask { margin-top: 10px; font-size: 32px; font-weight: 600; color: var(--brand-ink); }
    .ask b { color: var(--brand-tertiary); }
  </style>
</head>
<body>
  <div class="card fade hidden" id="card">
    <div class="top"><div class="live"></div><div class="eyebrow">Now playing · first listen</div></div>
    <div class="display song" id="song"></div>
    <div class="version" id="version"></div>
    <div class="meta" id="meta"></div>
    <div class="ask">Rate it <b>1–10</b> in chat 🎧</div>
  </div>

  <script src="config.js"></script>
  <script src="lib/obs-bus.js"></script>
  <script src="lib/overlay.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    StudioOverlay({
      render(s) {
        $('card').classList.toggle('hidden', !s.song);
        $('song').textContent = s.song || '';
        $('version').textContent = s.version || '';
        $('meta').textContent = [s.bpm && s.bpm + ' BPM', s.key, s.timeSig].filter(Boolean).join('  ·  ');
      },
    });
  </script>
</body>
</html>
